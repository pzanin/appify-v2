name: One-time runtime mock cleanup

on:
  push:
    branches:
      - feature/pwa-runtime-hardening

permissions:
  contents: write

jobs:
  cleanup-runtime-mocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pwa-runtime-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Remove fake customer-facing gamification state
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Anchor not found in {path}: {old[:180]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Preview: remove fake earned award/points state.
          replace_once(
              'src/components/PhoneMockup.tsx',
              "  const awards = pwaConfig.gamification?.awardsConfig || [];\n  const mockEarnedBadges = awards.length > 0 ? [awards[0].id] : [];\n  const mockTotalPoints = awards.length > 0 ? awards[0].points : 0;\n\n",
              "",
          )

          # Runtime: remove fake earned award/points state.
          replace_once(
              'src/components/PWARuntime.tsx',
              "  const awards = pwaConfig?.gamification?.awardsConfig || [];\n  const mockEarnedBadges = awards.length > 0 ? [awards[0].id] : [];\n  const mockTotalPoints = awards.length > 0 ? awards[0].points : 0;\n\n",
              "",
          )

          # Do not display a fabricated streak. Until real streak persistence exists, hide the pill entirely.
          phone = Path('src/components/PhoneMockup.tsx')
          text = phone.read_text(encoding='utf-8')
          start_marker = "            {/* Streak Pill */}\n"
          start = text.find(start_marker)
          end_marker = "            \n            <div className=\"phone-header-icon\""
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('PhoneMockup streak block not found')
          text = text[:start] + "            <div className=\"phone-header-icon\"" + text[end + len(end_marker):]
          phone.write_text(text, encoding='utf-8')

          replace_once(
              'src/components/PWARuntime.tsx',
              "            {gamification.enabled && gamification.enableStreaks && <div className=\"flex items-center gap-1.5 bg-white/20 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10\"><span className=\"text-sm\">{gamification.streakIcon}</span><span className=\"text-xs font-black\">3</span></div>}\n",
              "",
          )

          # Localize the remaining customer-visible completed-state action instead of hardcoding Portuguese.
          replace_once(
              'src/components/PWARuntime.tsx',
              'aria-label={t(\'app.modules.completed_status\')} title="Marcar como não concluída"',
              "aria-label={t('app.modules.completed_status')} title={t('app.modules.markIncomplete')}",
          )

          labels = {
              'pt': 'Marcar como não concluída',
              'en': 'Mark as incomplete',
              'es': 'Marcar como no completada',
              'fr': 'Marquer comme non terminée',
          }
          for locale, label in labels.items():
              path = Path(f'src/locales/{locale}.json')
              data = json.loads(path.read_text(encoding='utf-8'))
              data['app']['modules']['markIncomplete'] = label
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Guardrail: published/preview runtime must not contain fabricated streak or mock award variables.
          for file in ['src/components/PWARuntime.tsx', 'src/components/PhoneMockup.tsx']:
              text = Path(file).read_text(encoding='utf-8')
              for forbidden in ['mockEarnedBadges', 'mockTotalPoints']:
                  if forbidden in text:
                      raise SystemExit(f'{forbidden} still present in {file}')
              if '>3</span>' in text or '>3</' in text and 'streak' in text.lower():
                  raise SystemExit(f'Hardcoded streak value still present in {file}')

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Verify cleanup
        run: |
          npm run check:secrets
          npm run lint
          npm test
          npm run build:pwa
          npm run build

      - name: Commit verified cleanup
        run: |
          if git diff --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PWARuntime.tsx src/components/PhoneMockup.tsx src/locales/pt.json src/locales/en.json src/locales/es.json src/locales/fr.json
          git commit -m "Remove fabricated gamification state from customer runtime"
          git push origin HEAD:feature/pwa-runtime-hardening
