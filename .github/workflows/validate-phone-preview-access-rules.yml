name: Validate phone preview access rules

on:
  push:
    branches:
      - feature/access-rules-runtime

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply phone preview access patch
        run: node scripts/patch-phone-preview-access-rules.mjs
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Tests
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Secret scan
        run: npm run check:secrets
      - name: Commit verified phone preview access rules
        run: |
          rm scripts/patch-phone-preview-access-rules.mjs
          rm .github/workflows/validate-phone-preview-access-rules.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PhoneMockup.tsx scripts/patch-phone-preview-access-rules.mjs .github/workflows/validate-phone-preview-access-rules.yml
          git commit -m "fix: enforce access rules in phone preview"
          git push origin HEAD:feature/access-rules-runtime
