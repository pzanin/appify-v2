name: Apply Visual Builder Productivity Patch

on:
  push:
    branches:
      - feature/visual-builder-productivity
    paths:
      - scripts/patch-visual-builder-productivity.mjs
      - .github/workflows/apply-visual-builder-productivity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/visual-builder-productivity
          fetch-depth: 0

      - name: Apply patch
        run: node scripts/patch-visual-builder-productivity.mjs

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ModulesAndContent.tsx src/types.ts
          git commit -m "feat: improve visual builder block workflow"
          git push origin HEAD:feature/visual-builder-productivity
