name: One-time customer language audit

on:
  push:
    branches:
      - feature/pwa-runtime-hardening

permissions:
  contents: write

jobs:
  customer-language-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pwa-runtime-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Centralize customer-visible activity copy and safe errors
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Anchor not found in {path}: {old[:180]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/components/HtmlFrame.tsx',
              "  const storageError=({pt:'Não foi possível salvar o histórico neste aparelho. Verifique o espaço disponível e as permissões do navegador.',en:'Could not save history on this device. Check available space and browser permissions.',es:'No se pudo guardar el historial en este dispositivo. Revisa el espacio disponible y los permisos del navegador.',fr:\"Impossible d’enregistrer l’historique sur cet appareil. Vérifiez l’espace disponible et les autorisations du navigateur.\"} as Record<string,string>)[(uiLanguage || i18n.language)?.split('-')[0]] || 'Could not save history on this device.';\n",
              "  const storageError=t('app.errors.activityStorageError');\n",
          )
          replace_once(
              'src/components/HtmlFrame.tsx',
              "      setActivity(/^pages\\/lesson-\\d+-\\d+\\.html$/.test(activityPath || '') ? {source:html,url:activityPath} : {source:html,error:t('app.errors.activityDesktop')});\n",
              "      setActivity(/^pages\\/lesson-\\d+-\\d+\\.html$/.test(activityPath || '') ? {source:html,url:activityPath} : {source:html,error:t('app.errors.activityUnavailable')});\n",
          )
          replace_once(
              'src/components/HtmlFrame.tsx',
              "        if(event.data?.type==='appify:activity-error' && typeof event.data.message==='string') setActivity({source:html,error:t('app.errors.activityError',{message:event.data.message.slice(0,160)})});\n",
              "        if(event.data?.type==='appify:activity-error' && typeof event.data.message==='string') { console.error('[Appify] Interactive activity error:',event.data.message.slice(0,160)); setActivity({source:html,error:t('app.errors.activityUnavailable')}); }\n",
          )
          replace_once(
              'src/components/HtmlFrame.tsx',
              "  const locale=(uiLanguage || i18n.language)?.split('-')[0];\n  const resetText=({pt:'Limpar histórico desta atividade',en:'Clear this activity’s history',es:'Borrar el historial de esta actividad',fr:'Effacer l’historique de cette activité'} as Record<string,string>)[locale] || 'Clear this activity’s history';\n  const resetHistory=()=>{\n    if(!storageKey || !window.confirm(`${resetText}?`))return;\n",
              "  const resetText=t('app.errors.activityClearHistory');\n  const resetHistory=()=>{\n    if(!storageKey || !window.confirm(t('app.errors.activityClearHistoryConfirm')))return;\n",
          )

          translations = {
              'pt': {
                  'activityStorageError': 'Não foi possível salvar esta atividade neste aparelho. Verifique o espaço disponível e tente novamente.',
                  'activityClearHistory': 'Limpar respostas desta atividade',
                  'activityClearHistoryConfirm': 'Deseja limpar as respostas salvas desta atividade?'
              },
              'en': {
                  'activityStorageError': 'This activity could not be saved on this device. Check available space and try again.',
                  'activityClearHistory': 'Clear saved answers for this activity',
                  'activityClearHistoryConfirm': 'Clear the saved answers for this activity?'
              },
              'es': {
                  'activityStorageError': 'No se pudo guardar esta actividad en este dispositivo. Revisa el espacio disponible e inténtalo de nuevo.',
                  'activityClearHistory': 'Borrar las respuestas guardadas de esta actividad',
                  'activityClearHistoryConfirm': '¿Borrar las respuestas guardadas de esta actividad?'
              },
              'fr': {
                  'activityStorageError': 'Cette activité n’a pas pu être enregistrée sur cet appareil. Vérifiez l’espace disponible et réessayez.',
                  'activityClearHistory': 'Effacer les réponses enregistrées de cette activité',
                  'activityClearHistoryConfirm': 'Effacer les réponses enregistrées de cette activité ?'
              }
          }
          for locale, values in translations.items():
              path = Path(f'src/locales/{locale}.json')
              data = json.loads(path.read_text(encoding='utf-8'))
              data['app']['errors'].update(values)
              # Keep old keys harmless and customer-safe if legacy code ever references them.
              data['app']['errors']['activityDesktop'] = data['app']['errors']['activityUnavailable']
              data['app']['errors']['activityError'] = data['app']['errors']['activityUnavailable']
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Accessibility copy should not inject a fixed-language word into the published header.
          runtime = Path('src/components/PWARuntime.tsx')
          text = runtime.read_text(encoding='utf-8')
          text = text.replace('alt="Logo"', 'alt={displayAppName}')
          runtime.write_text(text, encoding='utf-8')

          phone = Path('src/components/PhoneMockup.tsx')
          text = phone.read_text(encoding='utf-8')
          text = text.replace('alt="Logo"', 'alt={displayAppName}')
          phone.write_text(text, encoding='utf-8')

          # Update regression expectations so customer-visible technical details cannot return.
          test_path = Path('src/components/HtmlFrame.test.ts')
          test_text = test_path.read_text(encoding='utf-8')
          test_text = test_text.replace(
              "  assert.equal(document.querySelector('iframe'),null);assert.match(document.body.textContent || '',/Appify desktop/);\n",
              "  assert.equal(document.querySelector('iframe'),null);assert.match(document.body.textContent || '',/Não foi possível abrir esta atividade/);assert.doesNotMatch(document.body.textContent || '',/Appify desktop|PWA exportado|pages/);\n",
          )
          test_text = test_text.replace(
              "  assert.match(document.body.textContent || '',/Erro na atividade: Invalid JavaScript/);\n",
              "  assert.match(document.body.textContent || '',/Não foi possível abrir esta atividade/);assert.doesNotMatch(document.body.textContent || '',/Invalid JavaScript/);\n",
          )
          test_path.write_text(test_text, encoding='utf-8')

          guard = Path('src/components/CustomerLanguageGuard.test.ts')
          guard.write_text("""import assert from 'node:assert/strict';
import { readFileSync } from 'node:fs';
import test from 'node:test';

const customerFiles = [
  'src/components/PWARuntime.tsx',
  'src/components/PhoneMockup.tsx',
  'src/components/HtmlFrame.tsx',
  'src/components/CustomerEntry.tsx',
  'src/components/InstallGuide.tsx',
  'src/components/CustomerProfilePanel.tsx',
  'src/components/CustomerLearning.tsx',
  'src/components/ContinueLearning.tsx',
  'src/components/ScreenErrorBoundary.tsx',
];

test('customer runtime does not expose known Appify implementation copy or manual locale maps', () => {
  const combined = customerFiles.map(file => readFileSync(file, 'utf8')).join('\\n');
  for (const forbidden of [
    'Abra esta prévia no Appify desktop',
    'Open this preview in the Appify desktop app',
    'PWA exportado',
    'exported PWA',
    'Erro na atividade: {{message}}',
    'Activity error: {{message}}',
    "pt:'Limpar histórico desta atividade'",
    "en:'Clear this activity’s history'",
    'title="Marcar como não concluída"',
    'alt="Logo"',
  ]) assert.equal(combined.includes(forbidden), false, `customer-visible implementation copy found: ${forbidden}`);
});
""", encoding='utf-8')

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Verify language audit
        run: |
          npm run check:secrets
          npm run lint
          npm test
          npm run build:pwa
          npm run build

      - name: Commit verified language cleanup
        run: |
          if git diff --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HtmlFrame.tsx src/components/HtmlFrame.test.ts src/components/PWARuntime.tsx src/components/PhoneMockup.tsx src/components/CustomerLanguageGuard.test.ts src/locales/pt.json src/locales/en.json src/locales/es.json src/locales/fr.json
          git commit -m "Harden customer-facing localization and activity errors"
          git push origin HEAD:feature/pwa-runtime-hardening
