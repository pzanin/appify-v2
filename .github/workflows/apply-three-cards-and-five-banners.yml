name: Apply Three Cards And Five Banners

on:
  push:
    branches:
      - feature/visual-builder-productivity-v2
    paths:
      - scripts/patch-three-cards-and-five-banners.mjs
      - .github/workflows/apply-three-cards-and-five-banners.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/visual-builder-productivity-v2
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: node scripts/patch-three-cards-and-five-banners.mjs
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Tests
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Secret scan
        run: npm run check:secrets
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.ts src/utils/builderHtml.ts src/components/ModulesAndContent.tsx src/components/IdentityConfigurator.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: improve three-card styling and allow five banners"
          git push origin HEAD:feature/visual-builder-productivity-v2
