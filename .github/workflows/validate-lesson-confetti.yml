name: Validate lesson confetti

on:
  push:
    branches:
      - feature/fix-lesson-confetti

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply lesson confetti patch
        run: node scripts/patch-lesson-confetti.mjs
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Tests
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Secret scan
        run: npm run check:secrets
      - name: Commit verified confetti fix
        run: |
          rm scripts/patch-lesson-confetti.mjs
          rm .github/workflows/validate-lesson-confetti.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PWARuntime.tsx src/utils/lessonCelebration.ts src/utils/lessonCelebration.test.ts scripts/patch-lesson-confetti.mjs .github/workflows/validate-lesson-confetti.yml
          git commit -m "fix: make lesson confetti override global visual default"
          git push origin HEAD:feature/fix-lesson-confetti
