name: One-time runtime closeout migration v2

"on":
  push:
    branches:
      - feature/pwa-runtime-hardening

permissions:
  contents: write

jobs:
  close-runtime-block:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pwa-runtime-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Close runtime productization block
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f'Anchor not found in {path}: {old[:180]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/services/projectService.ts',
              "  openProject: async (id: number): Promise<ProjectFile> => {\n    const desktop = desktopProjects();\n    const document = desktop ? await desktop.open(id) : await browserFallback.open(id);\n    activeProjectId = id;\n    return document;\n  },\n",
              "  openProject: async (id: number): Promise<ProjectFile> => {\n    const desktop = desktopProjects();\n    const document = desktop ? await desktop.open(id) : await browserFallback.open(id);\n    activeProjectId = id;\n    if (!document.workspace.pwaConfig?.productId) {\n      document.workspace.pwaConfig = { ...document.workspace.pwaConfig, productId: crypto.randomUUID() };\n      try {\n        document.project = desktop\n          ? await desktop.save(id, document.workspace)\n          : await browserFallback.save(id, document.workspace);\n      } catch {\n        console.warn('[Appify] Não foi possível persistir a identidade do produto legado nesta abertura.');\n      }\n    }\n    return document;\n  },\n",
          )

          replace_once(
              'src/utils/customerStorage.ts',
              "export function resetCustomerProductData(storage: Storage, config: PwaConfig, preview: boolean, projectId: number | null) {\n",
              "export function clearCustomerActivityData(storage: Storage, config: PwaConfig, preview: boolean, projectId: number | null) {\n  const prefix = `appify-activity:v1:${customerStorageScope(config, preview, projectId)}:`;\n  const remove: string[] = [];\n  for (let index = 0; index < storage.length; index++) {\n    const key = storage.key(index);\n    if (key?.startsWith(prefix)) remove.push(key);\n  }\n  remove.forEach(key => storage.removeItem(key));\n  return remove.length;\n}\n\nexport function resetCustomerProductData(storage: Storage, config: PwaConfig, preview: boolean, projectId: number | null) {\n",
          )

          replace_once(
              'src/components/HtmlFrame.tsx',
              "  const resetText=t('app.errors.activityClearHistory');\n  const resetHistory=()=>{\n    if(!storageKey || !window.confirm(t('app.errors.activityClearHistoryConfirm')))return;\n    try {window.localStorage.removeItem(storageKey);setStorageFailed(false);setStorageRevision(value=>value+1);}catch{setStorageFailed(true);}\n  };\n",
              "",
          )
          replace_once(
              'src/components/HtmlFrame.tsx',
              "  if(!hasBuilderVideo) return interactive ? <div className={className} style={{flex:1,minHeight:0,width:'100%',...style,display:'flex',flexDirection:'column'}}>{storageKey && /\\blocalStorage\\b/.test(html) && <button type=\"button\" onClick={resetHistory} style={{padding:6,fontSize:12,background:'#fff',color:'#555',border:0,textAlign:'right',cursor:'pointer'}}>{resetText}</button>}<div hidden={!storageFailed} role=\"alert\" style={{padding:8,background:'#fff3cd',color:'#574200',fontSize:13}}>{storageError}</div><div style={{flex:1,minHeight:0,position:'relative'}}>{innerFrame}</div></div> : innerFrame;\n",
              "  if(!hasBuilderVideo) return interactive ? <div className={className} style={{flex:1,minHeight:0,width:'100%',...style,display:'flex',flexDirection:'column'}}><div hidden={!storageFailed} role=\"alert\" style={{padding:8,background:'#fff3cd',color:'#574200',fontSize:13}}>{storageError}</div><div style={{flex:1,minHeight:0,position:'relative'}}>{innerFrame}</div></div> : innerFrame;\n",
          )

          replace_once(
              'src/components/CustomerProfilePanel.tsx',
              "import { customerProfileStorageKey, readCustomerProfile, resetCustomerProductData, writeCustomerProfile } from '../utils/customerStorage';\n",
              "import { clearCustomerActivityData, customerProfileStorageKey, readCustomerProfile, resetCustomerProductData, writeCustomerProfile } from '../utils/customerStorage';\n",
          )
          replace_once(
              'src/components/CustomerProfilePanel.tsx',
              "  const [status, setStatus] = useState<'idle' | 'saved' | 'error'>('idle');\n",
              "  const [status, setStatus] = useState<'idle' | 'saved' | 'error'>('idle');\n  const [activityStatus, setActivityStatus] = useState<'idle' | 'cleared' | 'error'>('idle');\n",
          )
          replace_once(
              'src/components/CustomerProfilePanel.tsx',
              "  const resetPreview = async () => {\n",
              "  const clearActivities = () => {\n    if (!window.confirm(t('app.profile.clearActivitiesConfirm'))) return;\n    try {\n      clearCustomerActivityData(window.localStorage, config, preview, projectId);\n      setActivityStatus('cleared');\n      window.dispatchEvent(new window.StorageEvent('storage', { key: null }));\n    } catch {\n      setActivityStatus('error');\n    }\n  };\n\n  const resetPreview = async () => {\n",
          )
          replace_once(
              'src/components/CustomerProfilePanel.tsx',
              "      {preview && onResetPreview && (\n",
              "      <details className={`w-full mt-8 border-t pt-5 ${dark ? 'border-white/10' : 'border-black/10'}`}>\n        <summary className={`cursor-pointer text-sm font-bold ${dark ? 'text-gray-300' : 'text-gray-700'}`}>{t('app.profile.dataAndPrivacy')}</summary>\n        <p className={`text-xs leading-relaxed mt-3 mb-3 ${dark ? 'text-gray-400' : 'text-gray-500'}`}>{t('app.profile.clearActivitiesNote')}</p>\n        <button type=\"button\" onClick={clearActivities} className={`w-full py-3 rounded-2xl font-bold text-sm border ${dark ? 'border-white/15 text-gray-300 bg-white/5' : 'border-black/10 text-gray-700 bg-white'}`}>\n          {t('app.profile.clearActivities')}\n        </button>\n        {activityStatus !== 'idle' && <div role={activityStatus === 'error' ? 'alert' : 'status'} className={`mt-3 text-xs font-bold ${activityStatus === 'error' ? 'text-red-500' : (dark ? 'text-emerald-300' : 'text-emerald-700')}`}>{activityStatus === 'cleared' ? t('app.profile.activitiesCleared') : t('app.profile.clearActivitiesError')}</div>}\n      </details>\n      {preview && onResetPreview && (\n",
          )

          translations = {
              'pt': {'dataAndPrivacy':'Dados e privacidade','clearActivities':'Limpar respostas salvas','clearActivitiesNote':'Remove apenas as respostas salvas nas atividades deste produto. Seu perfil e seu progresso nas aulas serão mantidos.','clearActivitiesConfirm':'Deseja limpar as respostas salvas nas atividades deste produto?','activitiesCleared':'Respostas salvas removidas.','clearActivitiesError':'Não foi possível limpar as respostas salvas.'},
              'en': {'dataAndPrivacy':'Data & privacy','clearActivities':'Clear saved activity answers','clearActivitiesNote':'Removes only saved activity answers for this product. Your profile and lesson progress will stay intact.','clearActivitiesConfirm':'Clear the saved activity answers for this product?','activitiesCleared':'Saved activity answers cleared.','clearActivitiesError':'Saved activity answers could not be cleared.'},
              'es': {'dataAndPrivacy':'Datos y privacidad','clearActivities':'Borrar respuestas guardadas','clearActivitiesNote':'Elimina solo las respuestas guardadas de las actividades de este producto. Tu perfil y tu progreso se mantendrán.','clearActivitiesConfirm':'¿Borrar las respuestas guardadas de las actividades de este producto?','activitiesCleared':'Respuestas guardadas eliminadas.','clearActivitiesError':'No se pudieron borrar las respuestas guardadas.'},
              'fr': {'dataAndPrivacy':'Données et confidentialité','clearActivities':'Effacer les réponses enregistrées','clearActivitiesNote':'Supprime uniquement les réponses enregistrées dans les activités de ce produit. Votre profil et votre progression sont conservés.','clearActivitiesConfirm':'Effacer les réponses enregistrées dans les activités de ce produit ?','activitiesCleared':'Réponses enregistrées effacées.','clearActivitiesError':'Impossible d’effacer les réponses enregistrées.'},
          }
          for locale, values in translations.items():
              path = Path(f'src/locales/{locale}.json')
              data = json.loads(path.read_text(encoding='utf-8'))
              data['app']['profile'].update(values)
              data['app']['errors'].pop('activityClearHistory', None)
              data['app']['errors'].pop('activityClearHistoryConfirm', None)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test_path = Path('src/utils/customerStorage.test.ts')
          text = test_path.read_text(encoding='utf-8')
          text = text.replace("import { clearCustomerProfile, customerEntryStorageKey, customerProfileStorageKey, customerStorageScope, readCustomerProfile, resetCustomerProductData, writeCustomerProfile } from './customerStorage';","import { clearCustomerActivityData, clearCustomerProfile, customerEntryStorageKey, customerProfileStorageKey, customerStorageScope, readCustomerProfile, resetCustomerProductData, writeCustomerProfile } from './customerStorage';")
          marker = "test('customer profile survives reload-like reads and trims bounded fields', () => {\n"
          extra = "test('activity-only clear keeps profile, entry and lesson progress intact', () => {\n  storage.clear();\n  const config = { ...INITIAL_PWA_CONFIG, productId: 'product-clear-test' };\n  const projectId = 91;\n  const scope = customerStorageScope(config, false, projectId);\n  const profile = customerProfileStorageKey(config, false, projectId);\n  const entry = customerEntryStorageKey(config, false, projectId);\n  const progress = `appify-lesson-progress:v1:${scope}`;\n  const activityA = `appify-activity:v1:${scope}:1:1`;\n  const activityB = `appify-activity:v1:${scope}:1:2`;\n  storage.setItem(profile, '{}'); storage.setItem(entry, 'done'); storage.setItem(progress, '{}'); storage.setItem(activityA, '{}'); storage.setItem(activityB, '{}');\n  assert.equal(clearCustomerActivityData(storage, config, false, projectId), 2);\n  assert.notEqual(storage.getItem(profile), null); assert.notEqual(storage.getItem(entry), null); assert.notEqual(storage.getItem(progress), null);\n  assert.equal(storage.getItem(activityA), null); assert.equal(storage.getItem(activityB), null);\n});\n\n"
          if extra not in text:
              if marker not in text: raise SystemExit('customerStorage marker missing')
              text = text.replace(marker, extra + marker, 1)
          test_path.write_text(text, encoding='utf-8')

          Path('src/services/projectIdentity.test.ts').write_text("""import assert from 'node:assert/strict';
import test from 'node:test';
import { projectService } from './projectService';

function project(id:number) { return { id, name:'Legacy', status:'Rascunho' as const, lastEdited:'2026-01-01T00:00:00.000Z', users:0, color:'#000', url:'legacy.test' }; }

test('opening a legacy project creates and persists one stable product identity', async () => {
  let saves=0;
  let document:any={schemaVersion:1,project:project(7),workspace:{pwaConfig:{appName:'Legacy'},appName:'Legacy'}};
  (globalThis as any).window={appifyDesktop:{projects:{open:async()=>structuredClone(document),save:async(_id:number,workspace:any)=>{saves++;document={...document,project:{...document.project,lastEdited:'2026-01-02T00:00:00.000Z'},workspace:structuredClone(workspace)};return document.project;}}}};
  const first=await projectService.openProject(7); const identity=first.workspace.pwaConfig.productId;
  assert.equal(typeof identity,'string'); assert.ok(identity.length>10); assert.equal(saves,1);
  const second=await projectService.openProject(7); assert.equal(second.workspace.pwaConfig.productId,identity); assert.equal(saves,1);
});

test('opening a project that already has productId does not rewrite it', async () => {
  let saves=0;
  const document:any={schemaVersion:1,project:project(8),workspace:{pwaConfig:{appName:'Stable',productId:'already-stable'},appName:'Stable'}};
  (globalThis as any).window={appifyDesktop:{projects:{open:async()=>structuredClone(document),save:async()=>{saves++;return document.project;}}}};
  const opened=await projectService.openProject(8); assert.equal(opened.workspace.pwaConfig.productId,'already-stable'); assert.equal(saves,0);
});
""", encoding='utf-8')

          guard = Path('src/components/CustomerLanguageGuard.test.ts')
          text = guard.read_text(encoding='utf-8')
          text = text.replace("    'alt=\"Logo\"',\n","    'alt=\"Logo\"',\n    \"t('app.errors.activityClearHistory')\",\n    'mockEarnedBadges',\n    'mockTotalPoints',\n    'mockProfileImg',\n")
          guard.write_text(text, encoding='utf-8')

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Verify closeout
        run: |
          npm run check:secrets
          npm run lint
          npm test
          npm run build:pwa
          npm run build

      - name: Commit verified closeout
        run: |
          if git diff --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/projectService.ts src/services/projectIdentity.test.ts src/utils/customerStorage.ts src/utils/customerStorage.test.ts src/components/HtmlFrame.tsx src/components/CustomerProfilePanel.tsx src/components/CustomerLanguageGuard.test.ts src/locales/pt.json src/locales/en.json src/locales/es.json src/locales/fr.json
          git commit -m "Close customer runtime productization block"
          git push origin HEAD:feature/pwa-runtime-hardening
