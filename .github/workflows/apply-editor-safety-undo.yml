name: Apply Editor Safety and Undo

on:
  push:
    branches:
      - feature/editor-safety-undo
    paths:
      - scripts/patch-editor-safety-undo.mjs
      - .github/workflows/apply-editor-safety-undo.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/editor-safety-undo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/patch-editor-safety-undo.mjs
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - run: npm run build
      - run: npm run check:secrets
      - name: Commit verified editor changes
        run: |
          rm scripts/patch-editor-safety-undo.mjs .github/workflows/apply-editor-safety-undo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: protect unsaved lessons and add undo redo"
          git push origin HEAD:feature/editor-safety-undo
