name: Apply Image Text Focus UI

on:
  push:
    branches:
      - feature/visual-builder-productivity-v2
    paths:
      - scripts/patch-image-text-focus-ui.mjs
      - .github/workflows/apply-image-text-focus-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visual-builder-productivity-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/patch-image-text-focus-ui.mjs
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - run: npm run build
      - run: npm run check:secrets
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ModulesAndContent.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: expose image text focus control"
          git push origin HEAD:feature/visual-builder-productivity-v2
