name: One-time material actions migration

"on":
  push:
    branches:
      - feature/pwa-runtime-hardening

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pwa-runtime-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply migration
        run: node scripts/one-time-material-actions.cjs
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Verify
        run: |
          npm run check:secrets
          npm run lint
          npm test
          npm run build:pwa
          npm run build
      - name: Commit verified changes
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src electron
          git commit -m "Add safe customer material and document actions"
          git push origin HEAD:feature/pwa-runtime-hardening
