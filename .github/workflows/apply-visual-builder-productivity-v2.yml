name: Apply Visual Builder Productivity V2

on:
  push:
    branches:
      - feature/visual-builder-productivity-v2
    paths:
      - scripts/patch-visual-builder-productivity-v2.mjs
      - .github/workflows/apply-visual-builder-productivity-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/visual-builder-productivity-v2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Apply patch
        run: node scripts/patch-visual-builder-productivity-v2.mjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Secret scan
        run: npm run check:secrets

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ModulesAndContent.tsx src/utils/builderHtml.ts src/types.ts src/hooks/useLessonProgress.ts src/components/PWARuntime.tsx
          git commit -m "feat: add visual builder productivity improvements"
          git push origin HEAD:feature/visual-builder-productivity-v2
