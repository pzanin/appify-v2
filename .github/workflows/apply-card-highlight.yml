name: Apply Card Highlight Styling

on:
  push:
    branches:
      - feature/visual-builder-productivity-v2
    paths:
      - scripts/patch-card-highlight.mjs
      - .github/workflows/apply-card-highlight.yml

permissions:
  contents: write

jobs:
  apply-card-highlight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/visual-builder-productivity-v2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Apply patch
        run: node scripts/patch-card-highlight.mjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Secret scan
        run: npm run check:secrets

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ModulesAndContent.tsx src/utils/builderHtml.ts src/types.ts
          git commit -m "fix: style card highlight inside card container"
          git push origin HEAD:feature/visual-builder-productivity-v2
