name: One-time profile unification

on:
  push:
    branches:
      - feature/pwa-runtime-hardening

permissions:
  contents: write

jobs:
  unify-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pwa-runtime-hardening
          fetch-depth: 0

      - name: Replace duplicated PhoneMockup profile
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/components/PhoneMockup.tsx")
          text = path.read_text(encoding="utf-8")

          if "<CustomerProfilePanel" in text and "mockProfileImg" not in text:
              print("PhoneMockup profile already unified")
              raise SystemExit(0)

          import_line = "import { CustomerProfilePanel } from './CustomerProfilePanel';"
          anchor = "import { CustomerEntry } from './CustomerEntry';\n"
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit("CustomerEntry import anchor not found")
              text = text.replace(anchor, anchor + import_line + "\n", 1)

          text = text.replace("  const [mockProfileImg, setMockProfileImg] = useState<string | null>(null);\n", "", 1)
          text = text.replace('  const [userName, setUserName] = useState("");\n', "", 1)
          text = text.replace('  const [userEmail, setUserEmail] = useState("");\n', "", 1)

          start_marker = "            ) : activeTab === 'perfil' ? (\n"
          end_marker = "            ) : activeTab === 'suporte' ? (\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start + len(start_marker)) if start >= 0 else -1
          if start < 0 or end < 0:
              raise SystemExit(f"Profile block markers not found: start={start} end={end}")

          replacement = (
              "            ) : activeTab === 'perfil' ? (\n"
              "              <motion.div key=\"perfil\" initial={{ opacity: 0, x: 20 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: -20 }} className=\"absolute inset-0 flex min-h-0\">\n"
              "                <CustomerProfilePanel config={pwaConfig} projectId={currentProjectId} preview={true} dark={isPhoneDark} themeColor={themeColor} />\n"
              "              </motion.div>\n"
              "            ) : activeTab === 'suporte' ? (\n"
          )
          text = text[:start] + replacement + text[end + len(end_marker):]

          forbidden = ["mockProfileImg", "setMockProfileImg", "setUserName", "setUserEmail", "image/jpeg, image/jpg"]
          leftovers = [item for item in forbidden if item in text]
          if leftovers:
              raise SystemExit(f"Legacy profile code still present: {leftovers}")
          if text.count("<CustomerProfilePanel") != 1:
              raise SystemExit("Expected exactly one shared CustomerProfilePanel in PhoneMockup")

          path.write_text(text, encoding="utf-8")
          print("PhoneMockup profile unified")
          PY

      - name: Commit structural fix
        run: |
          if git diff --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PhoneMockup.tsx
          git commit -m "Unify PhoneMockup with customer profile runtime [profile-unified]"
          git push origin HEAD:feature/pwa-runtime-hardening
