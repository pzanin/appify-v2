<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Respiración Kenshō — actividad de ejemplo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{zen:{base:'#faf1e0',sand:'#d6c3a3',brown:'#5b3626',sage:'#758875',teal:'#1c424b',rust:'#aa531d'}},fontFamily:{inter:['Inter','sans-serif']}}}};</script>
<style>
body{background:#faf1e0;color:#5b3626;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;margin:0;min-height:100dvh;padding:16px}
.zen-glass{background:rgba(255,255,255,.65);border:1px solid rgba(214,195,163,.5);box-shadow:0 25px 50px -12px rgba(91,54,38,.08)}
#breathing-circle{border-radius:50%;transition:transform 4s ease-in-out,background-color 4s ease-in-out;will-change:transform}
button:focus-visible{outline:3px solid #c0892f;outline-offset:4px}
@media(max-height:650px){body{align-items:flex-start}}
</style></head><body>
<main class="w-full max-w-md mx-auto"><div class="zen-glass p-8 rounded-[2.5rem] flex flex-col items-center">
<div class="flex gap-2 w-full mb-8"><button id="tab-monje" class="flex-1 py-2 text-xs rounded-full bg-zen-teal text-white" onclick="setMode('monje')">EL MONJE</button><button id="tab-caja" class="flex-1 py-2 text-xs rounded-full bg-white/40 text-zen-brown" onclick="setMode('caja')">LA CAJA</button><button id="tab-coherente" class="flex-1 py-2 text-xs rounded-full bg-white/40 text-zen-brown" onclick="setMode('coherente')">COHERENTE</button></div>
<h1 id="mode-title" class="text-2xl font-bold text-center mb-2">Respiración del Monje</h1><p id="mode-desc" class="text-sm text-center mb-8">Ritmo 4-7-8</p>
<div class="relative w-56 h-56 flex items-center justify-center mb-8"><div class="absolute inset-0 rounded-full border-2 border-dashed border-zen-sand"></div><div id="breathing-circle" class="absolute w-24 h-24 bg-zen-teal text-white flex flex-col items-center justify-center"><span id="instruction-text" class="text-xs">Preparado</span><span id="timer-number" class="text-4xl">-</span></div></div>
<p class="text-sm mb-8">Ciclos completos: <span id="cycle-count">0</span></p>
<div class="flex gap-6"><button id="btn-reset" aria-label="Reiniciar" class="w-12 h-12 rounded-full bg-white text-zen-brown" onclick="resetBreathing()"><svg class="w-5 h-5 mx-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4v5h5M4 9a8 8 0 1 1-1 6" stroke-width="2"/></svg></button><button id="btn-play" class="w-16 h-16 rounded-full bg-zen-teal text-white" onclick="toggleBreathing()">Iniciar</button></div>
<p class="text-xs text-center mt-8">Respira a tu ritmo. Puedes pausar cuando quieras.</p>
</div></main>
<script>
const patterns={monje:{title:'Respiración del Monje',phases:[['Inhala',4,2.2],['Sostén',7,2.2],['Exhala',8,1]]},caja:{title:'Respiración de Caja',phases:[['Inhala',4,2.2],['Sostén',4,2.2],['Exhala',4,1],['Vacío',4,1]]},coherente:{title:'Respiración Coherente',phases:[['Inhala',5,2.2],['Exhala',5,1]]}};
let mode='monje',running=false,interval=null,phaseIndex=0,time=0,cycles=0;
const el=id=>document.getElementById(id);
function applyPhase(){const phase=patterns[mode].phases[phaseIndex];time=phase[1];el('instruction-text').textContent=phase[0];el('timer-number').textContent=time;el('breathing-circle').style.transitionDuration=time+'s';el('breathing-circle').style.transform='scale('+phase[2]+')';}
function tick(){if(--time<=0){phaseIndex++;if(phaseIndex===patterns[mode].phases.length){phaseIndex=0;el('cycle-count').textContent=++cycles;}applyPhase();}else el('timer-number').textContent=time;}
function stop(){running=false;clearInterval(interval);interval=null;el('btn-play').textContent='Iniciar';el('instruction-text').textContent='Pausado';el('timer-number').textContent='-';el('breathing-circle').style.transform='scale(1)';}
function toggleBreathing(){if(running){stop();return;}running=true;el('btn-play').textContent='Pausar';phaseIndex=0;applyPhase();interval=setInterval(tick,1000);}
function resetBreathing(){stop();cycles=0;phaseIndex=0;el('cycle-count').textContent='0';el('instruction-text').textContent='Preparado';}
function setMode(value){resetBreathing();mode=value;el('mode-title').textContent=patterns[mode].title;el('mode-desc').textContent='Ritmo '+patterns[mode].phases.map(p=>p[1]).join('-');Object.keys(patterns).forEach(name=>{el('tab-'+name).className='flex-1 py-2 text-xs rounded-full '+(name===mode?'bg-zen-teal text-white':'bg-white/40 text-zen-brown');});}
window.addEventListener('pagehide',()=>clearInterval(interval));
</script></body></html>
